<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechStore · Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="brand"><span>TS</span><b>TechStore</b></div>
    <p class="sub">Crear cuenta</p>

    <form id="registro">
      <label for="fullName">Nombre completo</label>
      <input id="fullName" required>
      <label for="email">Email</label>
      <input id="email" type="email" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <ul class="rules" id="rules"></ul>
      <label for="store">Tienda asignada</label>
      <select id="store"><option>Central</option><option>Lima Centro</option><option>Arequipa</option></select>
      <button class="btn btn-pri" type="submit">Crear cuenta</button>
    </form>
    <div id="msg" class="msg"></div>
    <p class="small"><a href="/">Volver a iniciar sesión</a></p>
  </main>

  <script>
    const msg = document.getElementById('msg');
    const show = (text, ok = false) => { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.textContent = text; };

    // Mismas reglas que el backend (el backend vuelve a validar)
    const checks = [
      ['Mínimo 8 caracteres', (p) => p.length >= 8],
      ['Una mayúscula', (p) => /[A-Z]/.test(p)],
      ['Un número', (p) => /\d/.test(p)],
      ['Un carácter especial', (p) => /[^A-Za-z0-9]/.test(p)],
    ];
    const draw = () => {
      const p = password.value;
      rules.innerHTML = checks.map(([t, f]) => `<li class="${f(p) ? 'ok' : ''}">${f(p) ? '✔' : '•'} ${t}</li>`).join('');
    };
    password.addEventListener('input', draw); draw();

    document.getElementById('registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName: fullName.value, email: email.value, password: password.value, store: store.value }),
      });
      const data = await r.json();
      if (!r.ok) return show(data.errors.join(' · '));
      show('Cuenta creada. Ya puedes iniciar sesión.', true);
    });
  </script>
</body>
</html>
