<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechStore · Registro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="center"><div class="card">
  <div class="brand"><span>TS</span><b>TechStore</b></div>
  <p class="sub">Registro de nuevo usuario</p>
  <form id="f" novalidate>
    <label for="fullName">Nombre completo</label>
    <input id="fullName" required>
    <label for="email">Email (único)</label>
    <input id="email" type="email" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="new-password">
    <ul class="rules" id="rules"></ul>
    <label for="store">Tienda asignada</label>
    <select id="store"></select>
    <button type="submit">Crear cuenta</button>
  </form>
  <div id="msg" class="msg"></div>
  <p class="small"><a href="/">Volver a iniciar sesión</a></p>
</div></div>
<script src="common.js"></script>
<script>
  const rules = $('#rules');
  const draw = () => {
    const p = $('#password').value;
    rules.innerHTML = PASSWORD_CHECKS.map(([, t, fn]) => `<li class="${fn(p) ? 'ok' : ''}">${fn(p) ? '✔' : '✖'} ${t}</li>`).join('');
  };
  $('#password').addEventListener('input', draw); draw();
  api('/api/auth/stores').then((r) => { $('#store').innerHTML = r.data.map((s) => `<option>${s}</option>`).join(''); });

  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { fullName: $('#fullName').value, email: $('#email').value, password: $('#password').value, store: $('#store').value };
    const r = await api('/api/auth/register', { method: 'POST', body });
    if (!r.ok) return showMsg($('#msg'), (r.data.errors || [r.data.error]).join(' · '));
    showMsg($('#msg'), r.data.message, true);
  });
</script>
</body>
</html>
