<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechStore · Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="center"><div class="card">
  <div class="brand"><span>TS</span><b>TechStore</b></div>
  <p class="sub">Sistema de Gestión de Inventario · Acceso seguro <span id="idp" class="aws" hidden>Amazon Cognito</span></p>

  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit">Iniciar sesión</button>
  </form>
  <div id="msg" class="msg"></div>

  <div class="sep">— o continuar con —</div>
  <a class="btn social" href="/auth/google">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Google</a>
  <a class="btn social github" href="/auth/github">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="#fff"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    GitHub</a>

  <p class="small">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
</div></div>
<script src="common.js"></script>
<script>
  api('/api/auth/provider').then((r) => { if (r.data.provider === 'cognito') $('#idp').hidden = false; });
  if (new URLSearchParams(location.search).get('error') === 'oauth') showMsg($('#msg'), 'No se pudo completar el login social.');
  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await api('/api/auth/login', { method: 'POST', body: { email: $('#email').value, password: $('#password').value } });
    if (!r.ok) {
      const extra = r.data.remaining !== undefined ? ` (intentos restantes: ${r.data.remaining})` : '';
      return showMsg($('#msg'), r.data.error + extra);
    }
    sessionStorage.setItem('mfaToken', r.data.mfaToken);
    location.href = 'mfa.html' + (r.data.mfaSetup ? '?setup=1' : '');
  });
</script>
</body>
</html>
